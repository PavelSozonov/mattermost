---
name: Deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = dry run with diff (changes nothing); apply = deploy"
        type: choice
        options: [check, apply]
        default: check

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --disable-pip-version-check "ansible-core>=2.17,<2.19"
          ansible-galaxy collection install -r requirements.yml

      - name: Configure SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Run playbook
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          MM_DOMAIN: ${{ secrets.MM_DOMAIN }}
          MM_POSTGRES_PASSWORD: ${{ secrets.MM_POSTGRES_PASSWORD }}
          MM_EDGE_ENABLED: ${{ vars.MM_EDGE_ENABLED }}
          MM_EDGE_EXTERNAL_NETWORK: ${{ vars.MM_EDGE_EXTERNAL_NETWORK }}
          MM_MANAGE_HOST_BASELINE: ${{ vars.MM_MANAGE_HOST_BASELINE }}
          MM_BACKUP_ENABLED: ${{ vars.MM_BACKUP_ENABLED }}
          MM_BACKUP_S3_ENDPOINT: ${{ secrets.MM_BACKUP_S3_ENDPOINT }}
          MM_BACKUP_S3_BUCKET: ${{ secrets.MM_BACKUP_S3_BUCKET }}
          MM_BACKUP_S3_REGION: ${{ secrets.MM_BACKUP_S3_REGION }}
          MM_BACKUP_S3_ACCESS_KEY: ${{ secrets.MM_BACKUP_S3_ACCESS_KEY }}
          MM_BACKUP_S3_SECRET_KEY: ${{ secrets.MM_BACKUP_S3_SECRET_KEY }}
          MODE: ${{ inputs.mode }}
          ANSIBLE_HOST_KEY_CHECKING: "True"
        run: |
          umask 077
          jq -n \
            --arg domain "$MM_DOMAIN" \
            --arg password "$MM_POSTGRES_PASSWORD" \
            --arg port "${DEPLOY_PORT:-22}" \
            --arg edge "${MM_EDGE_ENABLED:-false}" \
            --arg extnet "${MM_EDGE_EXTERNAL_NETWORK:-}" \
            --arg baseline "${MM_MANAGE_HOST_BASELINE:-true}" \
            --arg backup "${MM_BACKUP_ENABLED:-false}" \
            --arg s3_endpoint "${MM_BACKUP_S3_ENDPOINT:-}" \
            --arg s3_bucket "${MM_BACKUP_S3_BUCKET:-}" \
            --arg s3_region "${MM_BACKUP_S3_REGION:-}" \
            --arg s3_access "${MM_BACKUP_S3_ACCESS_KEY:-}" \
            --arg s3_secret "${MM_BACKUP_S3_SECRET_KEY:-}" \
            '{
              mattermost_domain: $domain,
              mattermost_postgres_password: $password,
              ansible_port: ($port | tonumber),
              mattermost_edge_enabled: ($edge == "true"),
              mattermost_edge_external_network: $extnet,
              manage_host_baseline: ($baseline != "false"),
              mattermost_backup_enabled: ($backup == "true"),
              mattermost_backup_s3_endpoint: $s3_endpoint,
              mattermost_backup_s3_bucket: $s3_bucket,
              mattermost_backup_s3_region: $s3_region,
              mattermost_backup_s3_access_key: $s3_access,
              mattermost_backup_s3_secret_key: $s3_secret
            }' > "$RUNNER_TEMP/extra_vars.json"
          check_args=()
          if [ "$MODE" != apply ]; then
            # The .env task sets diff: false, so the database password never
            # reaches the (public) job log.
            check_args=(--check --diff)
          fi
          ansible-playbook site.yml "${check_args[@]}" \
            -i "${DEPLOY_HOST}," \
            -u "$DEPLOY_USER" \
            --private-key "$HOME/.ssh/deploy_key" \
            -e "@$RUNNER_TEMP/extra_vars.json"
