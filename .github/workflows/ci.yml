---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    # Bounds below: about 10x the slowest of the last 8 green runs (pre-commit
    # 57 s, syntax 59 s, gitleaks 9 s, 2026-10-20) with room for a cold cache.
    timeout-minutes: 15
    steps:
      # Depth 2: on a pull_request the hooks run on the PR's files, the merge
      # commit against its first parent (step "Run checks").
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # ansible-lint's pre-commit hook requires a python3.14 interpreter
          python-version: "3.14"

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit

      # A pull_request runs the hooks on the PR's files only, so a docs-only
      # PR does not lint the whole repository; a push to main runs them on
      # all files. ansible-lint lints the whole project on every run anyway
      # (always_run in its hook manifest).
      - name: Run checks
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            pre-commit run --from-ref HEAD^1 --to-ref HEAD --show-diff-on-failure
          else
            pre-commit run --all-files --show-diff-on-failure
          fi

  syntax-check:
    name: Ansible syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --disable-pip-version-check "ansible-core>=2.17,<2.19"
          ansible-galaxy collection install -r requirements.yml

      - name: Syntax check
        run: ansible-playbook --syntax-check -i inventories/example/hosts.yml site.yml

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.0"
    steps:
      - name: Check out the full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd /tmp
          curl -fsSLO --connect-timeout 10 --max-time 120 --retry 3 "${base}/${archive}"
          curl -fsSLO --connect-timeout 10 --max-time 120 --retry 3 \
            "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" gitleaks

      - name: Scan the whole history
        run: /tmp/gitleaks detect --source . --redact --no-banner
